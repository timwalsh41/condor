[project]
name = "condor"
version = "0.1.0"
description = "Golf Swing Analyzer - frame-accurate dual video analysis"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",

    # Async file I/O
    "aiofiles==23.2.1",

    # Data validation and settings
    "pydantic==2.5.0",
    "pydantic-settings>=2.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Environment configuration
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<9",
    "pytest-asyncio>=0.24,<2",
    "httpx==0.25.0",
    "pytest-cov>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4,<9",
    "pytest-asyncio>=0.24,<2",
    "httpx==0.25.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, isort

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
