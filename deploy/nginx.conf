# nginx configuration for the Condor frontend container.
#
# Serves the Vite SPA bundle on HTTPS (443) with a self-signed certificate.
# HTTP (80) requests are permanently redirected to HTTPS.
# API and video requests are reverse-proxied to the backend on port 8000.
#
# The self-signed certificate is generated during the Docker image build
# (see Dockerfile.frontend). Browsers will show a security warning on first
# visit; add a permanent exception to proceed.

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Self-signed certificate generated at image build time
    ssl_certificate     /etc/nginx/ssl/condor.crt;
    ssl_certificate_key /etc/nginx/ssl/condor.key;

    # Modern TLS only
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve static SPA bundle
    root /usr/share/nginx/html;
    index index.html;

    # Health check passthrough (useful for container orchestrators)
    location /health {
        proxy_pass         http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Reverse-proxy all API calls to the FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Support large video uploads (matches backend limit)
        client_max_body_size 512m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;

        # Disable response buffering so large video stream downloads are not
        # held in nginx memory. Without this, nginx buffers the entire response
        # before forwarding, which causes the browser to stall and drop the
        # connection mid-transfer on large (60MB+) files.
        proxy_buffering    off;

        # Forward HTTP range request headers for partial-content support.
        proxy_set_header   Range      $http_range;
        proxy_set_header   If-Range   $http_if_range;
    }

    # Proxy video streaming endpoints (range-request support)
    location /video/ {
        proxy_pass         http://backend:8000/video/;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   Range           $http_range;
        proxy_set_header   If-Range        $http_if_range;
        proxy_buffering    off;
    }

    # Single-page application: fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
