# nginx configuration for the Condor frontend container.
#
# Serves the Vite SPA bundle and reverse-proxies /api/* requests to the
# backend service on port 8000.

server {
    listen 80;
    server_name _;

    # Serve static SPA bundle
    root /usr/share/nginx/html;
    index index.html;

    # Health check passthrough (useful for container orchestrators)
    location /health {
        proxy_pass         http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Reverse-proxy all API calls to the FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Support large video uploads (matches backend limit)
        client_max_body_size 512m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # Proxy video streaming endpoints (range-request support)
    location /video/ {
        proxy_pass         http://backend:8000/video/;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   Range           $http_range;
        proxy_set_header   If-Range        $http_if_range;
        proxy_buffering    off;
    }

    # Single-page application: fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
